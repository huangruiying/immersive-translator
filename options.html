<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>网页双语翻译助手 · 设置</h1>
  <p class="desc">对接任意 OpenAI 兼容的大模型接口（/v1/chat/completions）。配置在 Chrome 与 Edge 中通用。</p>
  <div class="notice">
    翻译时，扩展会把你主动翻译的网页文本或选中文本发送到你填写的接口地址。API Key 仅保存在本机浏览器，不会同步到浏览器账号。
  </div>

  <label>接口地址 (Base URL)
    <input id="apiBase" type="text" placeholder="https://api.openai.com/v1">
  </label>
  <label>API Key
    <input id="apiKey" type="password" placeholder="sk-...">
  </label>
  <label>模型名称
    <input id="model" type="text" placeholder="gpt-4o-mini">
  </label>
  <label>目标语言
    <input id="targetLang" type="text" placeholder="中文">
  </label>
  <label>显示模式
    <select id="mode">
      <option value="bilingual">双语对照（保留原文）</option>
      <option value="translation">仅显示译文（隐藏原文）</option>
    </select>
  </label>
  <label>自定义提示词（可选，使用 {text} 与 {lang} 占位符）
    <textarea id="prompt" rows="5" placeholder="留空则使用内置翻译提示词"></textarea>
  </label>

  <div class="row">
    <button id="save">保存</button>
    <button id="test">测试连接</button>
    <span id="msg"></span>
  </div>

  <script src="api.js"></script>
  <script src="options.js"></script>
</body>
</html>
