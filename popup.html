<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <h1>沉浸式翻译</h1>
    <div id="status" class="status">就绪</div>
    <button id="translate">翻译当前页面</button>
    <button id="restore">还原</button>
    <a id="options" href="#">扩展设置</a>
    <div class="hint">
      快捷键：Ctrl+Shift+U 翻译 / Ctrl+Shift+Y 还原<br>
      在页面上选中文字后右键可「翻译选中内容」
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
